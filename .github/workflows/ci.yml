# Builds and tests SharpCommander on the three desktop platforms for every push and pull request on master.
# A tag named v<version> additionally publishes the seven runtime identifiers with the csproj defaults
# (self-contained, partially trimmed) through the repository's publish scripts and attaches the ZIP archives
# to a GitHub release. The tag must match <Version> in Directory.Build.props.
#
# Run by hand from the Actions tab on master with "Publish a release" ticked, it does the same without a tag being
# pushed first: the release is created for v<Version> of Directory.Build.props, and GitHub creates that tag on the
# commit that was built. It refuses when that release already exists, so a version is never published twice.

name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release for the version in Directory.Build.props (master only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung run used to sit until GitHub's six-hour limit; the whole job takes a few minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SharpCommander.sln

      - name: Build
        run: dotnet build SharpCommander.sln -c Release --no-restore

      - name: Test
        # If a test ever hangs, fail within minutes and name the tests that were running.
        run: dotnet test SharpCommander.sln -c Release --no-build --blame-hang --blame-hang-timeout 5m

  # The tag of the release: the pushed tag, or v<Version> when the release is started from the Actions tab.
  version:
    name: Release version
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and the tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -o '<Version>[^<]*</Version>' Directory.Build.props | sed -E 's#</?Version>##g')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Directory.Build.props"
              exit 1
            fi
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$version already exists. Set a new <Version> in Directory.Build.props first."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/master')
    needs: [build-test, version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-x86 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./publish.ps1 -Platform ${{ matrix.rid }}

      - name: Publish (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ./publish.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: SharpCommander-${{ matrix.rid }}
          path: publish/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/master')
    needs: [publish, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The release text is .github/release-notes/<tag>.md when it exists, else GitHub's generated list.
      - name: Find the release notes
        id: notes
        shell: bash
        run: |
          file=".github/release-notes/${{ needs.version.outputs.tag }}.md"
          if [ -f "$file" ]; then echo "path=$file" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SharpCommander ${{ needs.version.outputs.tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
